[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# Conservative EVM target (no PUSH0 / newer opcodes). Arc's supported EVM version was not confirmed,
# so this avoids a failed deployment. Use the SAME value when verifying on ArcScan.
evm_version = "paris"

[fuzz]
runs = 512

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network/"
